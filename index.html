<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Redução de ICMS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
<header>
    <h1>Calculadora de redução do ICMS</h1>
</header>
<main>
    <div class="main-container">
        <h3>Preencha os valores</h3>
        <form id="values">
            <h4>Valor de venda</h4>
            <input id="valorVenda" type="number">
            <h4>Valor do ICMS</h4>
            <input id="valorICMS" type="number">
            <input type="submit" value="Calcular" id="calculate">
        </form>
        <input id="valorFinal" type="number">
    </div>
    <p>Importante! o valor do ICMS é reduzido em 70% do seu valor original.</p>
</main>
<footer>
    <div class="footer-container">
    <p>&copy; 2026</p>
    </div>
</footer>
</body>
</html>
