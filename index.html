<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/calculator.png" type="image/png">
    <title>Calculadora de Redução de ICMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Calculadora de redução do ICMS</h1>
        <h3>Preencha os valores a seguir:</h3>
        <form id="values">
            <label for="valorVenda">Valor de venda:</label>
            <input id="valorVenda" type="number" placeholder="R$ 0,00">
            <label for="valorICMS">Valor do ICMS:</label>
            <input id="valorICMS" type="number" placeholder="R$ 0,00">
            <button type="button" class="btn btn-success" id="calculate">Calcular</button>
            <input id="valorFinal" type="number" placeholder="R$ 0,00" readonly>
            <button type="button" class="btn btn-danger" id="cleanBtn">Limpar</button>
        </form>
        <p>Importante! Preencher com o ICMS efetivo.</p>
        <button type="button" class="btn btn-outline-secondary" id="info">Detalhes</button>
    </div>
    <div class="hide" id="informations">
        <p>Informações sobre a redução do ICMS:</p>
        <ul>
            <li>O ICMS é reduzido em <strong>70%</strong> do seu valor original.</li>
            <li>O valor final é calculado subtraindo o valor reduzido do ICMS do valor de venda.</li>
        </ul>
        <label for="valorReduzido">Valor reduzido:</label>
        <input id="valorReduzido" type="number" placeholder="R$ 0,00" readonly>
        <button type="button" class="btn btn-danger" id="closeBtn">Fechar</button>
    </div>
    <div class="footer-container">
        <p>&copy; 2026</p>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
