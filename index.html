<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Redução de ICMS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Calculadora de redução do ICMS</h1>
        <h3>Preencha os valores abaixo</h3>
        <form id="values">
            <label for="valorVenda">Valor de venda</label>
            <input id="valorVenda" type="number">
            <label for="valorICMS">Valor do ICMS</label>
            <input id="valorICMS" type="number">
            <input type="submit" value="Calcular" id="calculate">
            <input id="valorFinal" type="number" readonly>
        </form>
        <p>Importante! o valor do ICMS é reduzido em 70% do seu valor original.</p>
    </div>
</body>
</html>
